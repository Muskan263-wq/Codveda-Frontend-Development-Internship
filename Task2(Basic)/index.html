<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Registration Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="form-card">
      <h2>Create Account</h2>
      <p class="subtitle">Please fill in your details carefully.</p>

      <form id="signupForm" novalidate>
        <div class="field-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
          />
          <div class="error" id="nameErr" aria-live="polite"></div>
        </div>

        <div class="field-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
          />
          <div class="error" id="emailErr" aria-live="polite"></div>
        </div>

        <div class="field-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter 10-digit phone number"
          />
          <div class="error" id="phoneErr" aria-live="polite"></div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a strong password"
          />
          <div class="error" id="passwordErr" aria-live="polite"></div>
          <p class="help-text">
            Use at least 8 characters with uppercase, lowercase, a number, and a
            symbol.
          </p>
        </div>

        <button type="submit">Register</button>
        <div
          class="success-message"
          id="successMessage"
          aria-live="polite"
        ></div>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
